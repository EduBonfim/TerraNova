# ═════════════════════════════════════════════════════════════════════════════
# TERRA NOVA - SPRING BOOT CONFIGURATION
# ═════════════════════════════════════════════════════════════════════════════

# Application
spring.application.name=terra-nova-backend
server.port=8080

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE - PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/terra-nova?sslmode=disable&prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:sua_senha_postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings (Connection Pool)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=TerraNovaHikariPool
spring.datasource.hikari.keepalive-time=30000


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.terranova=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# ─────────────────────────────────────────────────────────────────────────────
# JACKSON
# ─────────────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_empty

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────────────────────────────────────
# Mantenha esta chave segura
app.jwt.secret=${JWT_SECRET:substitua_por_uma_chave_secreta_de_32_caracteres_ou_mais}
app.jwt.expiration=86400000

# ─────────────────────────────────────────────────────────────────────────────
# SWAGGER / OpenAPI
# ─────────────────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─────────────────────────────────────────────────────────────────────────────
# MIGRAÇÃO DE DADOS
# ─────────────────────────────────────────────────────────────────────────────
# Habilitado para criar usuários e dados de teste iniciais
migration.enabled=true
app.seed.demo-data=true

springdoc.swagger-ui.enabled=true

# ─────────────────────────────────────────────────────────────────────────────
# CORS
# ─────────────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# Expor endpoints do actuator em desenvolvimento para diagnóstico
# management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.include=health,info,loggers,httptrace,env
management.endpoint.httptrace.enabled=true

# Forçar codificação UTF-8 para requests/responses JSON
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ─────────────────────────────────────────────────────────────────────────────
# ARMAZENAMENTO DE ARQUIVOS / IMAGENS
# ─────────────────────────────────────────────────────────────────────────────
app.upload.dir=uploads/images
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
